async function download(url, key, label, w0, w1){
  try{ const c = await idb.get(key); if(c){ setMsg(label + ' (saved)', w1); return c; } }catch(_){}
  const r = await fetch(url); if(!r.ok) throw new Error(label + ' HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = []; let got = 0;
  for(;;){ const {done, value} = await rd.read(); if(done) break; parts.push(value); got += value.length; setMsg(label + ' ' + Math.round(got/1048576) + ' MB', w0 + (w1-w0)*(total ? got/total : 0.5)); }
  const buf = await new Blob(parts).arrayBuffer();
  try{ await idb.set(key, buf); }catch(_){}
  return buf;
}

// ---- kitchen ----
function shrinkTex(root, lim){
  root.traverse(o => { if(!o.isMesh) return; for(const m of (Array.isArray(o.material) ? o.material : [o.material])){ if(!m) continue;
    for(const k of ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap']){ const t = m[k]; if(!t || !t.image || t.userData.s) continue; t.userData.s = 1;
      const w = t.image.width, h = t.image.height; if(!w || w <= lim) continue;
      const r = lim/Math.max(w,h), cv = document.createElement('canvas'); cv.width = Math.round(w*r); cv.height = Math.round(h*r);
      cv.getContext('2d').drawImage(t.image, 0, 0, cv.width, cv.height); t.image = cv; t.needsUpdate = true; }
    m.needsUpdate = true; } });
}
async function loadKitchen(buf){
  const gltf = await new GLTFLoader().parseAsync(buf, '');
  const kit = gltf.scene; kit.scale.setScalar(0.1); kit.position.set(4.3, -1.456, -9.45);   // 1 unit = 10 cm, room centre at the origin, floor at y = 0
  scene.add(kit); kit.updateMatrixWorld(true);
  kit.traverse(o => { if(o.isMesh){ o.frustumCulled = true; const b = new THREE.Box3().setFromObject(o); if(b.min.y > 3.8) o.visible = false; } });   // hide the ceiling so the camera can see in
  shrinkTex(kit, 1024);
}

    o.userData = {key:n, spot:i % SPOTS.length}; items.push(o);

}

// --- walking on the floor map (A* over the free cells) ---
const GW = GRID.W, GH = GRID.H, cellOf = (x, z) => [Math.floor(x*10 + GX0), Math.floor(z*10 + GZ0)], centre = (i, j) => [(i + 0.5 - GX0)/10, (j + 0.5 - GZ0)/10];

// --- reading the room for the brain ---
function mapText(){
  const rows = [];
  for(let z = WORLD.z0; z <= WORLD.z1 + 1e-6; z += 0.5){
    let row = '';
    for(let x = WORLD.x0; x <= WORLD.x1 + 1e-6; x += 0.5){ const h = surface(x, z); const [i, j] = cellOf(x, z); row += (h != null && h >= 0.8 && h <= 1.4) ? 'C' : (isFree(i, j) ? '.' : '#'); }

}

  a.busy = true; const tok = ++a.token; aiOn.lastThink = performance.now(); aiOn.calls++;
  aiLog((a.id === 'chef' ? 'Chef' : 'You') + ' is thinking…');
  const res = await api('brain', {role:a.id === 'chef' ? 'chef' : 'player', goal:goal.slice(0, 240), me:{x:r2(a.x), z:r2(a.z)}, held:a.held ? a.held.userData.key : null,
    items:items.map(o => ({k:o.userData.key, name:(o.userData.name || NICE[o.userData.key] || 'item').slice(0, 40), x:r2(o.position.x), y:r2(o.position.y), z:r2(o.position.z)})).slice(0, 40), map:mapText()});
  if(tok !== a.token){ return; }
  if(!res || res.error){ aiLog('⚠ ' + ((res && res.error) || 'no answer')); a.busy = false; return; }
  if(res.say) speak(a, res.say);
  await runPlan(a, res.actions || [], tok);
  if(tok === a.token) a.busy = false;
}
function snapTarget(x, z){
  const [ci, cj] = cellOf(x, z); let best = null, bs = 1e9;
  for(let a = -15; a <= 15; a++) for(let b = -15; b <= 15; b++){
    const px = (ci + a + 0.5 - GX0)/10, pz = (cj + b + 0.5 - GZ0)/10, h = surface(px, pz); if(h == null) continue;
    const taken = items.some(o => !o.userData.heldBy && Math.hypot(o.position.x - px, o.position.z - pz) < 0.28);
    const s = Math.hypot(a, b) + (taken ? 12 : 0) + (h >= 0.8 && h <= 1.4 ? 0 : 6); if(s < bs){ bs = s; best = {x:px, z:pz, y:h}; }
  }
  return best;
}
async function loadModel(r){
  const url = r.url.startsWith('/') ? ASSET_BASE + r.url : r.url, buf = await (await fetch(url)).arrayBuffer();
  const gltf = await new GLTFLoader().parseAsync(buf, ''), inner = gltf.scene, wrap = new THREE.Group();
  shrinkTex(inner, 512); wrap.add(inner); wrap.updateMatrixWorld(true);
  return {wrap, inner};
}
async function runPlan(a, actions, tok){
  for(const act of actions){
    if(tok !== a.token) return;
    try{
      if(act.do === 'say') speak(a, act.text);
      else if(act.do === 'wait') await sleep(act.s*1000);
      else if(act.do === 'goto') await walkTo(a, act.x, act.z);
      else if(act.do === 'pick'){
        if(a.held){ speak(a, 'My hands are full.'); continue; }
        const key = String(act.item).toLowerCase(), it = items.find(o => !o.userData.heldBy && (o.userData.key === key || (o.userData.name || '').toLowerCase().includes(key) || (NICE[o.userData.key] || '').includes(key)));
        if(!it){ speak(a, "I can't find that."); continue; }
        await walkTo(a, it.position.x, it.position.z); if(tok !== a.token) return;
        face(a, it.position.x, it.position.z); await sleep(350); if(tok !== a.token) return;
        it.userData.heldBy = a.id; a.held = it;
      } else if(act.do === 'place'){
        if(!a.held){ speak(a, 'I need to pick something up first.'); continue; }
        const t = snapTarget(act.x, act.z); if(!t){ speak(a, 'There is nowhere to put it there.'); continue; }
        await walkTo(a, t.x, t.z); if(tok !== a.token) return;
        face(a, t.x, t.z); await sleep(350); if(tok !== a.token) return;
        const it = a.held; it.position.set(t.x, t.y, t.z); it.rotation.y = (act.rot || 0)*Math.PI/180; it.userData.heldBy = null; a.held = null;
      } else if(act.do === 'fetch'){
        if(fetchCount >= 6 || performance.now() - lastFetchAt < 20000){ speak(a, "I'll fetch that a bit later."); continue; }
        const t = snapTarget(act.x, act.z); if(!t) continue;
        lastFetchAt = performance.now(); fetchCount++; speak(a, 'Looking for a ' + act.q + '…');
        const res = await api('model', {q:act.q}); if(tok !== a.token) return;
        if(res.error){ speak(a, "Couldn't get one: " + res.error); continue; }
        await walkTo(a, t.x, t.z); if(tok !== a.token) return;
        const {wrap, inner} = await loadModel(res); if(tok !== a.token) return;
        const bx = new THREE.Box3().setFromObject(wrap), sz = bx.getSize(new THREE.Vector3()), k = act.size/Math.max(sz.x, sz.y, sz.z, 1e-3);
        inner.scale.multiplyScalar(k); wrap.updateMatrixWorld(true);
        const b2 = new THREE.Box3().setFromObject(wrap), c2 = b2.getCenter(new THREE.Vector3()); inner.position.x -= c2.x; inner.position.z -= c2.z; inner.position.y -= b2.min.y;
        wrap.position.set(t.x, t.y, t.z); wrap.userData = {key:'ai_' + (++aiN), name:String(res.name || act.q).slice(0, 28), heldBy:null};
        wrap.scale.setScalar(0.01); scene.add(wrap); items.push(wrap);
        extraCredits.push({item:wrap.userData.name, title:res.name, author:res.author, license:res.license, source:res.source}); renderCredits();
        for(let s = 0; s <= 10; s++){ wrap.scale.setScalar(Math.max(0.01, s/10)); await sleep(30); }
        speak(a, 'Here is a ' + wrap.userData.name + '.');
      }
    }catch(e){ console.warn('plan step failed', e); aiLog('⚠ something went wrong'); return; }
  }
}
// --- panel ---
const aiPanel = $('#ai'); let aiTarget = 'chef';
$('#ab').onclick = () => { aiPanel.style.display = aiPanel.style.display === 'block' ? 'none' : 'block'; };
document.querySelectorAll('#ai .tg button').forEach(b => b.onclick = () => { aiTarget = b.dataset.t; document.querySelectorAll('#ai .tg button').forEach(x => x.classList.toggle('on', x === b)); });
$('#aigo').onclick = () => { const v = $('#aiin').value.trim(); if(!v) return; $('#aiin').value = ''; aiLog('→ ' + v);
  if(aiTarget === 'chef'){ cancelPlan(chef); think(chef, v); } else { if(placing){ placing = false; updateAct(); } cancelPlan(playerAgent); think(playerAgent, v); } };
$('#aiin').addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Enter') $('#aigo').click(); });
$('#aiin').addEventListener('keyup', e => e.stopPropagation());
$('#aiauto').onchange = e => { aiOn.auto = e.target.checked; aiLog(aiOn.auto ? 'Auto chef is on.' : 'Auto chef is off.'); aiOn.lastThink = performance.now(); };
function autoTick(){
  if(!aiOn.auto || chef.busy || chef.path.length || aiOn.calls > 30) return;
  if(performance.now() - aiOn.lastThink < 25000) return;
  think(chef, 'Make the kitchen ready for cooking. Put loose cookware where a cook would want it on the counters, keeping the counters tidy. If something a cook clearly needs is missing (an ingredient, an appliance, a stool), fetch ONE small free model for it.');
}

// ---- start ----
let last = performance.now();
function frame(now){ const dt = Math.min(0.05, (now - last)/1000); last = now; step(dt); renderer.render(scene, camera); requestAnimationFrame(frame); }
(async () => {
  try{
    const kb = await download(KITCHEN_URL, 'kitchen-v1', 'Kitchen', 0, 0.35);
    await loadKitchen(kb);
    try{ const wb = await download(KW_URL, 'ware-v1', 'Cookware', 0.35, 0.5); await loadWare(wb); }catch(e){ console.warn('cookware', e); }
    const cb = await download(CHAR_URL, 'remy-v1', 'Remy', 0.5, 0.9);
    setMsg('Getting ready…', 0.95); await loadRemy(cb); makeChef();
    step(0.001); try{ await renderer.compileAsync(scene, camera); }catch(_){} renderer.render(scene, camera);
    setMsg('Ready', 1); const L = $('#load'); L.style.opacity = 0; setTimeout(() => L.remove(), 700);
    requestAnimationFrame(frame);
  }catch(e){ console.error(e); setMsg('Could not load: ' + (e.message || e), 0); }
})();
</script>
